; HiBy R1 - Feature Flags / Exception Settings (a:\exception.ini)
; Place on SD card root
; These enable hidden features without binary patching

; DAC output to storage mode: 0=off, 1=on
dac_to_store=0

; Disable EQ in play menu: 0=EQ available, 1=EQ hidden
playmenu_eq_disable=0

; Dark theme: 0=off, 1=on
dark_theme_enable=1

; Screenshot feature: 0=off, 1=on
screen_short_enable=1

; Colored lyrics: 0=off, 1=on
lyric_color_enable=1

; Album art cache on SD card: 0=off, 1=on
tf_image_cache_enable=1

; Music database on SD card: 0=off, 1=on
tf_music_db_enable=1

; Disable volume warning popup: 0=show warning, 1=suppress
disable_vol_warn=1

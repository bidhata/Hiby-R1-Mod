; HiBy R1 - MSEB (Mage Sound 8-Ball) Settings (a:\mseb.ini)
; Place on SD card root
; NOTE: MSEB requires model spoof or binary patch to be accessible on R1

; Reset to defaults: 0=keep, 1=reset on next boot
reset=0

; Preset name repeat check
name_repeat=0

; Active MSEB preset name
mseb_name=Default

; MSEB input parameters (JSON-like encoded)
mseb_input=

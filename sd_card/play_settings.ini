; HiBy R1 - Play Settings (a:\play_settings.ini)
; Place on SD card root

; Play mode: 0=sequential, 1=repeat_all, 2=repeat_one, 3=shuffle
play_mode=0

; Gapless playback: 0=off, 1=on
gapless_play=1

; DSD output mode: 0=DoP (DSD over PCM), 1=Native DSD
dsd_output=0

; Digital filter: 0=sharp roll-off, 1=slow roll-off, 2=short delay sharp, 3=short delay slow
digital_filter=0

; Replay gain: 0=off, 1=track, 2=album
replaygain_type=0

; EQ type/enable
type=0
enable=1

; Fade in/out: 0=off, 1=on
fade=0

; Volume memory (remembers last volume)
memory=1

; Balance: 0=center, negative=left, positive=right (range -20 to 20)
balance=0

; DB storage change notification
db_storage_change=0

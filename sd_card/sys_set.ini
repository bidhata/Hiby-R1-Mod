; HiBy R1 - System Settings (a:\sys_set.ini)
; Place on SD card root

; Language (locale string)
language=en

; Theme index (0-based)
theme=0

; Screen brightness (0-100)
screen=80

; Screen timeout in seconds (0=never)
screen_timeout=60

; Sleep timer in minutes (0=off)
sleep_timer=0

; Scan music gain display string
scan_music_gain=

; Fast find/index disable: 0=enabled, 1=disabled
fast_find_disable=0

; Stream media display string
stream_media=

; Developer options: 0=hidden, 1=shown
developer_options=1

; Japan certificate display
japan_certificate=
